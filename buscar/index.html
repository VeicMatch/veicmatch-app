<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c2338">
  <title>VeícMatch — Seu próximo carro</title>
  <style>
    :root {
      color-scheme: light;
      --azul: #0c2338;
      --verde: #005943;
      --texto-secundario: #465b62;
      --linha: #d5dfdb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: #f4f7f5;
      color: var(--azul);
      font: 16px/1.5 system-ui, sans-serif;
    }

    .marca {
      display: grid;
      place-items: center;
      min-height: 100px;
      padding: 14px 20px;
      border-bottom: 1px solid #a88b54;
      background: var(--azul);
    }

    .marca img {
      display: block;
      border-radius: 50%;
    }

    main {
      width: min(100% - 40px, 860px);
      margin-inline: auto;
      padding-block: clamp(34px, 7vw, 84px) 48px;
    }

    .introducao {
      max-width: 660px;
      margin: 0 auto clamp(24px, 5vw, 42px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6.6vw, 64px);
      font-weight: 800;
      text-align: center;
      line-height: 1.06;
      letter-spacing: -.05em;
      text-wrap: balance;
    }

    .introducao p {
      max-width: 520px;
      margin: 14px auto 0;
      color: var(--texto-secundario);
      font-size: clamp(16px, 2.6vw, 19px);
      text-wrap: pretty;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .caminho {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: clamp(16px, 3vw, 26px);
      border: 1px solid var(--linha);
      border-radius: 12px;
      background: #fff;
      color: inherit;
      text-decoration: none;
    }

    .caminho:hover {
      border-color: var(--verde);
      background: #f0faf5;
    }

    .caminho:focus-visible {
      outline: 3px solid var(--verde);
      outline-offset: 3px;
    }

    .caminho strong {
      display: block;
      font-size: clamp(18px, 2.4vw, 22px);
      line-height: 1.22;
      letter-spacing: -.025em;
    }

    .descricao {
      display: block;
      margin-top: 6px;
      color: var(--texto-secundario);
      font-size: 15px;
      line-height: 1.45;
    }

    .icone-caminho {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 50%;
      background: #e5f2eb;
    }

    @media (max-width: 560px) {
      .introducao { text-align: left; }
      h1 { text-wrap: initial; }
      nav { grid-template-columns: 1fr; gap: 10px; }
    }
  </style>
</head>
