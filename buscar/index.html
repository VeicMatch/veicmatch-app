<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c2338">
  <title>VeícMatch — Encontre seu próximo carro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(20px, 6vw, 52px) 16px;
      color: #1e293b;
      background: radial-gradient(ellipse at 50% 12%, #254e5d, transparent 66%),
        linear-gradient(110deg, #0c2338, #143343 55%, #10443a);
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { max-width: 640px; margin: auto; }
    header {
      padding: 18px;
      border-bottom: 3px solid #c9a65a;
      border-radius: 14px;
      background: #0c2338;
      color: white;
      text-align: center;
      font-size: 26px;
      font-weight: 750;
    }
    section {
      margin-top: 16px;
      padding: clamp(18px, 5vw, 30px);
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      background: white;
    }
    h1 { margin: 0 0 20px; color: #0c2338; font-size: clamp(24px, 6vw, 32px); line-height: 1.2; }
    nav { display: grid; gap: 12px; }
    a {
      display: block;
      padding: 14px 16px;
      border: 1px solid #cbd5e1;
      border-left: 4px solid #006b50;
      border-radius: 9px;
      color: #0c2338;
      text-decoration: none;
    }
    a:hover, a:focus-visible { background: #ecfdf5; }
    a:focus-visible { outline: 3px solid #006b50; outline-offset: 3px; }
    strong { font-size: 18px; }
    small { display: block; margin-top: 4px; color: #475569; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <header>VeícMatch</header>
    <section aria-labelledby="titulo">
      <h1 id="titulo">Como você quer buscar seu próximo carro?</h1>
      <nav aria-label="Modo de busca">
        <a href="/">
          <strong>Já sei qual carro quero</strong>
          <small>Busque pelo modelo que você tem em mente.</small>
        </a>
        <a href="/motor-2/">
          <strong>Quero ajuda para escolher</strong>
          <small>Responda ao questionário e receba indicações para o seu perfil.</small>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
