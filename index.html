<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VeicMatch — Motor 1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f6f9;
      color: #1b222c;
    }
    .card {
      max-width: 520px;
      margin: 24px auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
    }
    p {
      line-height: 1.5;
      color: #445060;
    }
    .aviso {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #eef3fa;
      font-size: 13px;
      color: #2b3a4a;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>VeicMatch</h1>
    <p>Base inicial publicada na Vercel para ligar a interface aos cálculos e simulações do Google Sheets.</p>
    <div class="aviso">
      Aviso de transparência: simulações, avaliações de troca e redirecionamentos para estoques parceiros seguem os critérios definidos no projeto.
    </div>
  </div>
</body>
</html>
